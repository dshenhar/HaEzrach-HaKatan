#version: "3.3"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: news360
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh
      # - ./db360.dump:/docker-entrypoint-initdb.d/db360.dump   # dump not present locally
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d news360"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: fastapi_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEV_KEY: ${DEV_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/news360
      HF_TOKEN: ${HF_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
    ports:
      - "8000:8000"      # published to the host so the app can reach it
    volumes:
      - ./db:/db
    restart: unless-stopped
    healthcheck:
      # python:3.12-slim ships no curl, so the old curl-based check always failed
      # and flagged a perfectly healthy container as unhealthy
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s



  ingest:                      # replacement for `scheduler`: same pipeline, no hebrew_classifier
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: ingest_worker
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/news360
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./db:/app/db
    command: ["local_ingest.py"]
    restart: unless-stopped

