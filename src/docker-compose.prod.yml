# Production stack for a single VPS.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from docker-compose.yml, which stays the local dev stack:
#   - nothing but Caddy is reachable from outside. Postgres and the API sit on the
#     internal network; the old file published 8000 straight to the host.
#   - Caddy terminates HTTPS. The web app is served from Vercel over HTTPS, and a
#     browser refuses to call a plain-http API from an https page, so this is not
#     optional. API_HOST is an sslip.io name, which resolves to the server's IP and
#     which Let's Encrypt will issue a certificate for - no domain purchase needed.
#   - every service restarts on its own, including after the VPS reboots.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: news360
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d news360"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: fastapi_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/news360
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
    volumes:
      - ./db:/db
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ingest:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: ingest_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/news360
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
    volumes:
      - ./db:/app/db
      - hf_cache:/root/.cache/huggingface
    command: ["python", "local_ingest.py"]

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_HOST: ${API_HOST:?set API_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  hf_cache:
  caddy_data:
  caddy_config:
