<!doctype html><html dir="rtl"><head><meta charset="utf-8">
<!-- public/og.png is this card drawn at 115.7% and cut 1200x630, the logo's top
     left corner at (265, 115) of the cut and the background filling past the card -->
<style>
  /* the app's own font, from its packages: open this file from ui/ after npm install */
  @font-face{font-family:"Rubik";font-weight:400;src:url(../node_modules/@expo-google-fonts/rubik/400Regular/Rubik_400Regular.ttf)}
  @font-face{font-family:"Rubik";font-weight:800;src:url(../node_modules/@expo-google-fonts/rubik/800ExtraBold/Rubik_800ExtraBold.ttf)}
  html,body{margin:0;padding:0;background:#F8F8F8}
  body{padding:285px 0}
  .card{width:1200px;height:630px;background:#F8F8F8;position:relative;overflow:hidden;
        font-family:"Rubik",-apple-system,Arial,sans-serif;box-sizing:border-box}
  .top{position:absolute;top:54px;left:0;right:0;text-align:center}
  .logo{width:400px}
  .tag{margin-top:22px;font-size:36px;font-weight:800;color:#111827}
  .sub{margin-top:10px;font-size:25px;color:#6B7280}
  .crowd{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:720px}
</style></head>
<body><div class="card">
  <div class="top">
    <img class="logo" src="images/logo-ink.png">
    <div class="tag">כל החדשות, משני צדי המפה</div>
    <div class="sub">גם אלה שאתם לא רגילים לקרוא</div>
  </div>
  <img class="crowd" src="images/parlament.png">
</div></body></html>
