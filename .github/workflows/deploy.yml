# Push to main: publish what changed - the server (api + ingest job) when server/
# changed, the web app when ui/ changed - with the same ./deploy.sh a person or a
# Claude Code session runs by hand.
#
# Code only. The keys stay where they are, in Secret Manager, and the timers and
# the database settings as they are: those belong to server/deploy-gcp.sh, which
# the owner runs. So the only secret here is the deploy account's key, and that
# account cannot change who has access to the project.
#
# One-time setup: docs/github-actions-setup.md

name: Deploy

on:
  push:
    branches: [main]
  # Actions -> Deploy -> Run workflow: publishes both, whatever changed
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the commit main was on before this push, to see what the push changed
          fetch-depth: 0

      - name: What changed
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          both() { printf 'server=true\nweb=true\n' >> "$GITHUB_OUTPUT"; }
          # a manual run, or a push whose previous commit is not known (a new
          # branch, a force push): publish both
          if [ "$EVENT" != push ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "publishing both"; both; exit 0
          fi
          files="$(git diff --name-only "$BEFORE" HEAD)"
          printf '%s\n' "$files"
          has() { grep -qE "$1" <<< "$files" && echo true || echo false; }
          # a change to how publishing works is tried on both
          if [ "$(has '^(deploy\.sh|scripts/|\.github/workflows/)')" = true ]; then both; exit 0; fi
          {
            echo "server=$(has '^server/(src/|cloudbuild\.yaml)')"
            echo "web=$(has '^ui/')"
          } >> "$GITHUB_OUTPUT"

      - name: The deploy key is set
        if: steps.changed.outputs.server == 'true' || steps.changed.outputs.web == 'true'
        env:
          KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          [ -n "$KEY" ] || {
            echo "::error::The repository secret GCP_SERVICE_ACCOUNT_JSON is not set - see docs/github-actions-setup.md"
            exit 1
          }

      - uses: google-github-actions/auth@v2
        if: steps.changed.outputs.server == 'true' || steps.changed.outputs.web == 'true'
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.changed.outputs.server == 'true'

      - name: Server - the api and the ingest job
        if: steps.changed.outputs.server == 'true'
        run: ./deploy.sh server

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.web == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # installs ui/'s packages, checks the api answers, builds, and publishes
      # (ui/deploy-firebase.sh); firebase-tools signs in with the key the auth
      # step left in GOOGLE_APPLICATION_CREDENTIALS
      - name: Web - Firebase Hosting
        if: steps.changed.outputs.web == 'true'
        run: ./deploy.sh web
